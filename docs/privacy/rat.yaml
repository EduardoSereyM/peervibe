# Registro de Actividades de Tratamiento (RAT) — peervibe
# Estado: v0.2 — decisiones D-01 a D-06 confirmadas. Los valores marcados "propuesta" aún requieren confirmación.
# Los marcados "[validar]" requieren revisión legal.
# Referencias: Playbook de Privacidad v2 (secciones 0.1–0.5, 2.x, 5.x) y Playbook peervibe v1.1.

proyecto: peervibe
version_rat: "0.2"
decisiones:
  D-01: "Edad mínima 18 años."
  D-02: "No se pide el nombre real; la identidad pública es el username."
  D-03: "No se recolectan rango de edad, país ni ciudad hasta que exista una finalidad concreta."
  D-04: "Analítica sin cookies ni datos personales."
  D-05: "Al suprimir la cuenta, el usuario elige si borrar sus reseñas o conservarlas como 'Usuario privado'."
  D-06: "Responsable: persona natural."

nivel_riesgo: N2   # Contenido generado por usuarios, cuentas, analítica e IA. Ver nota en T-03 sobre datos sensibles incidentales.
responsable: "Persona natural (Edu) — completar nombre legal y domicilio en la política de privacidad"
canal_derechos:
  correo: "privacidad@[dominio]"
  formulario: "/privacidad/solicitud"
edad_minima: 18   # D-01 confirmada: no se admiten menores; el Módulo 5.2 del playbook no aplica

encargados:
  - id: supabase
    servicio: Base de datos, autenticación y almacenamiento de archivos
    pais: "[según región elegida, propuesta: São Paulo]"
    dpa: pendiente
  - id: vercel
    servicio: Hosting del frontend
    pais: EE.UU. / red global
    dpa: pendiente
  - id: render
    servicio: Hosting del backend (FastAPI)
    pais: "[según región elegida]"
    dpa: pendiente
  - id: google
    servicio: Inicio de sesión (OAuth)
    pais: EE.UU.
    dpa: pendiente
  - id: apple
    servicio: Inicio de sesión (OAuth)
    pais: EE.UU.
    dpa: pendiente
  - id: resend
    servicio: Correos transaccionales y de marketing
    pais: EE.UU.
    dpa: pendiente
  - id: proveedor_ia
    servicio: Síntesis de reseñas (LLM)
    pais: "[por definir]"
    dpa: pendiente
    condiciones: [sin entrenamiento con datos del cliente, retención mínima]
  - id: proveedor_analitica
    servicio: Analítica de uso
    pais: "[por definir]"
    dpa: pendiente

tratamientos:

  - id: T-01
    nombre: Cuenta y autenticación
    finalidad: Crear y mantener la cuenta del usuario y permitirle iniciar sesión con Google o Apple.
    base_licitud: contrato
    titulares: [usuarios registrados]
    datos:
      - {campo: "auth.users.email", categoria: contacto}
      - {campo: "auth.users (identificador del proveedor OAuth)", categoria: identificacion}
    sistemas: [supabase_auth, user_private]
    encargados: [supabase, google, apple]
    transferencia_internacional: true
    retencion: {plazo: "vida de la cuenta; inactiva 24 meses → aviso 30 días antes y supresión", accion: supresion, estado: propuesta}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-02
    nombre: Perfil público y reputación
    finalidad: Mostrar el perfil público del usuario, su historial de reseñas, puntos y rango, para que la comunidad pueda valorar su criterio.
    base_licitud: contrato
    titulares: [usuarios registrados]
    datos:
      - {campo: "user_profiles.username", categoria: identificacion, publico: true}
      - {campo: "user_profiles.avatar_url", categoria: identificacion, publico: true}
      - {campo: "user_profiles.reputation_points", categoria: actividad, publico: true}
      - {campo: "user_profiles.user_rank", categoria: actividad, publico: true}
    sistemas: [user_profiles, supabase_storage]
    encargados: [supabase]
    transferencia_internacional: true
    retencion: {plazo: vida de la cuenta, accion: supresion}
    consentimiento: {requerido: false}
    informar_en: [registro, politica_privacidad]   # el usuario debe saber que su perfil es público
    eipd_requerida: false

  - id: T-03
    nombre: Publicación de reseñas
    finalidad: Publicar las reseñas, calificaciones y fotos de producto que el usuario escribe.
    base_licitud: contrato
    titulares: [usuarios registrados]
    datos:
      - {campo: "reviews.pros / reviews.contras / reviews.commentary", categoria: contenido, publico: true}
      - {campo: "reviews.ratings_breakdown / reviews.rating_final", categoria: contenido, publico: true}
      - {campo: "reviews.user_id", categoria: vinculo, publico: true}
      - {campo: "fotos del producto (Storage)", categoria: contenido, publico: true}
    sistemas: [reviews, supabase_storage]
    encargados: [supabase]
    transferencia_internacional: true
    retencion:
      plazo: indefinido mientras la reseña esté publicada
      al_suprimir_cuenta: "el usuario elige: borrar sus reseñas o conservarlas desvinculadas como 'Usuario privado' (D-05)"
    consentimiento: {requerido: false}
    riesgos:
      - "Datos sensibles incidentales: en categorías como suplementos o cosmética, el texto libre puede revelar condiciones de salud ('lo uso para mi diabetes')."
      - "Mitigación propuesta: aviso en el formulario de no incluir datos de salud ni de terceros, y criterio de moderación para editarlos o rechazarlos."
    eipd_requerida: false   # [validar] si se lanza con categorías de salud (suplementos)

  - id: T-04
    nombre: Verificación de compra
    finalidad: Verificar que el usuario compró el producto para otorgar la medalla "Compra Verificada".
    base_licitud: consentimiento
    titulares: [usuarios registrados que suben un comprobante]
    datos:
      - {campo: "review_proofs.storage_path (imagen de boleta o caja)", categoria: "identificacion, financiero (incidental)", publico: false}
      - {campo: "review_proofs.verification_status", categoria: actividad}
    sistemas: [review_proofs, supabase_storage_privado]
    encargados: [supabase]
    transferencia_internacional: true
    retencion: {plazo: "30 días desde la verificación o el rechazo; se conserva solo el resultado (reviews.is_verified)", accion: borrado_de_imagen, estado: propuesta}
    consentimiento:
      requerido: true
      texto_corto: "Usar mi comprobante para verificar la compra · Consentimiento · se borra 30 días después de verificar"
    notas: "Recomendar al usuario tapar datos personales; evaluar recorte o desenfoque automático en el pipeline de imágenes."
    eipd_requerida: false

  - id: T-05
    nombre: Prevención de fraude y moderación
    finalidad: Detectar reseñas falsas, cuentas múltiples y abuso, y moderar el contenido.
    base_licitud: interes_legitimo   # [validar]
    titulares: [usuarios registrados, visitantes]
    datos:
      - {campo: "ip_hmac (HMAC de la IP con clave rotada cada 90 días)", categoria: identificador_tecnico, estado: propuesta}
      - {campo: "user agent y patrones de actividad", categoria: identificador_tecnico}
      - {campo: "user_profiles.is_banned", categoria: actividad}
    sistemas: [fraud_signals (por diseñar), user_profiles]
    encargados: [supabase, render]
    transferencia_internacional: true
    retencion: {plazo: 90 días, accion: borrado}
    decisiones_automatizadas:
      existe: true
      descripcion: "Shadowban o bloqueo automático por señales de fraude."
      salvaguarda: "Notificación al usuario y canal de revisión humana antes de un baneo definitivo."
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-06
    nombre: Votos de utilidad
    finalidad: Permitir que los usuarios marquen reseñas como útiles y ponderar el ranking.
    base_licitud: contrato
    titulares: [usuarios registrados]
    datos:
      - {campo: "review_votes.user_id / vote_type", categoria: actividad, publico: false}
    sistemas: [review_votes]
    encargados: [supabase]
    transferencia_internacional: true
    retencion: {plazo: indefinido, al_suprimir_cuenta: "el voto se conserva anónimo (user_id = NULL)"}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-07
    nombre: Síntesis de reseñas con IA
    finalidad: Generar el resumen de pros y contras de cada producto a partir de las reseñas publicadas.
    base_licitud: interes_legitimo   # [validar]
    titulares: [autores de reseñas]
    datos:
      - {campo: "texto de reseñas aprobadas, sin username ni identificadores", categoria: contenido}
    sistemas: [backend_ia]
    encargados: [proveedor_ia]
    transferencia_internacional: true
    minimizacion: "Se envía solo el texto, con redacción automática de nombres, correos, teléfonos y RUT."
    retencion: {plazo: "sin retención en el proveedor; el resumen generado no contiene datos personales"}
    consentimiento: {requerido: false}
    oposicion: "Preferencia para excluir las propias reseñas de la síntesis."
    eipd_requerida: false

  - id: T-08
    nombre: Analítica de uso
    finalidad: Medir el uso del sitio de forma agregada para mejorar el producto.
    base_licitud: interes_legitimo   # [validar] procede solo si efectivamente no se tratan datos personales
    titulares: [visitantes, usuarios registrados]
    datos:
      - {campo: "eventos agregados (páginas vistas, referencias, dispositivo genérico) sin identificador persistente", categoria: agregado}
    sistemas: [proveedor_analitica]
    encargados: [proveedor_analitica]
    transferencia_internacional: "[según proveedor]"
    retencion: {plazo: 24 meses, accion: agregacion}
    consentimiento: {requerido: false}
    condiciones:
      - "Sin cookies ni almacenamiento local en el navegador."
      - "La IP no se almacena; si el proveedor la usa, es solo de forma transitoria."
      - "Sin identificadores entre sesiones ni cruce con la cuenta del usuario."
    notas: "D-04 confirmada. Si se incorpora cualquier herramienta con cookies de analítica o marketing, este tratamiento pasa a base consentimiento y se requiere banner."
    eipd_requerida: false

  - id: T-09
    nombre: Afiliación (botón "Ver precio en...")
    finalidad: Redirigir a tiendas y medir los clics de salida para el modelo de comisiones.
    base_licitud: interes_legitimo   # [validar]
    titulares: [visitantes, usuarios registrados]
    datos:
      - {campo: "clic de salida (producto, tienda, fecha) SIN identificador de usuario", categoria: agregado, estado: propuesta}
    sistemas: [outbound_clicks (por diseñar)]
    encargados: [supabase]
    transferencia_internacional: true
    retencion: {plazo: 24 meses, accion: agregacion}
    consentimiento: {requerido: false}
    notas: "Si los clics se registran sin identificar al usuario, no hay datos personales. Las cookies de afiliado las instala la tienda en su propio dominio, bajo su propia política."
    eipd_requerida: false

  - id: T-10
    nombre: Comunicaciones transaccionales
    finalidad: Avisar sobre el estado de las reseñas, la verificación y la seguridad de la cuenta.
    base_licitud: contrato
    titulares: [usuarios registrados]
    datos:
      - {campo: "auth.users.email", categoria: contacto}
    sistemas: [backend]
    encargados: [resend]
    transferencia_internacional: true
    retencion: {plazo: "logs de envío 90 días", accion: borrado}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-11
    nombre: Novedades y promociones
    finalidad: Enviar novedades de la plataforma, beneficios y cupones de marcas aliadas.
    base_licitud: consentimiento
    titulares: [usuarios registrados]
    datos:
      - {campo: "auth.users.email", categoria: contacto}
    sistemas: [backend]
    encargados: [resend]
    transferencia_internacional: true
    retencion: {plazo: hasta la revocación, accion: baja}
    consentimiento:
      requerido: true
      texto_corto: "Recibir novedades y promociones · Consentimiento · hasta que te des de baja"
    notas: "Los datos nunca se entregan a las marcas aliadas; los cupones se envían desde peervibe."
    eipd_requerida: false

  - id: T-12
    nombre: Atención de derechos
    finalidad: Recibir, gestionar y responder solicitudes de acceso, rectificación, supresión, oposición, portabilidad y bloqueo.
    base_licitud: obligacion_legal
    titulares: [usuarios registrados, visitantes, terceros]
    datos:
      - {campo: "privacy_requests (tipo, estado, fechas, correo de respuesta)", categoria: contacto}
    sistemas: [privacy_requests]
    encargados: [supabase, resend]
    transferencia_internacional: true
    retencion: {plazo: "3 años [validar]; el correo de respuesta se borra al cerrar", accion: borrado}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-13
    nombre: Registro de consentimientos
    finalidad: Acreditar ante la Agencia qué consintió cada persona, cuándo y sobre qué versión.
    base_licitud: obligacion_legal
    titulares: [usuarios registrados, visitantes]
    datos:
      - {campo: "consents (subject_id seudónimo, finalidad, versión, acción, IP truncada, user agent, fecha)", categoria: identificador_tecnico}
    sistemas: [consents, privacy_subjects]
    encargados: [supabase]
    transferencia_internacional: true
    retencion: {plazo: "vida de la relación + plazo de prescripción [validar]", accion: desvinculacion_y_borrado}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-14
    nombre: Seguridad y auditoría
    finalidad: Proteger la plataforma, detectar accesos indebidos y reconstruir incidentes.
    base_licitud: interes_legitimo   # [validar]
    titulares: [usuarios registrados, administradores]
    datos:
      - {campo: "audit_log (actor, acción, IP truncada, fecha)", categoria: identificador_tecnico}
      - {campo: "logs de aplicación", categoria: identificador_tecnico}
    sistemas: [audit_log, logs_externos]
    encargados: [supabase, render, "[servicio de logs por definir]"]
    transferencia_internacional: true
    retencion: {plazo: "auditoría 12 meses; logs de aplicación 90 días", accion: borrado}
    consentimiento: {requerido: false}
    eipd_requerida: false

  - id: T-15
    nombre: Cuentas de marcas (B2B)
    finalidad: Permitir a las marcas reclamar su perfil, responder reseñas y ver métricas agregadas.
    base_licitud: contrato
    titulares: [representantes de marcas]
    datos:
      - {campo: "nombre, correo corporativo, empresa, cargo", categoria: contacto_profesional}
    sistemas: ["[por diseñar, fuera del MVP]"]
    encargados: [supabase, resend]
    transferencia_internacional: true
    retencion: {plazo: "vigencia del contrato + 2 años [validar]", accion: supresion}
    consentimiento: {requerido: false}
    restriccion: "Las marcas solo reciben métricas agregadas; nunca datos personales de quienes reseñan."
    eipd_requerida: false
    estado: fuera_del_mvp
